name: "CLA Assistant"
on:
  issue_comment:
    types: [created]
  # zizmor: ignore[dangerous-triggers] The CLA bot needs pull_request_target and never checks out PR code.
  pull_request_target:
    types: [opened,closed,synchronize]

permissions:
  contents: read

jobs:
  CLAssistant:
    runs-on: ubuntu-latest
    # Signs with the coder-cla App key; only main may use it. pull_request_target and
    # issue_comment always run the default branch's copy of this workflow, and the
    # job only checks PRs into main.
    environment: cla
    if: >-
      (github.event_name == 'issue_comment' && (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA')) ||
      (github.event_name == 'pull_request_target' && github.event.pull_request.base.ref == 'main')
    permissions:
      pull-requests: write
      id-token: write # Cloud KMS signs the coder-cla App's JWT
    steps:
      # Writes signatures to coder/cla, which GITHUB_TOKEN can't reach.
      - name: Generate coder-cla App token
        id: cla_token
        # The App's key is a non-exportable Cloud KMS key; only this workflow, in this environment,
        # may sign with it.
        uses: coder/github-app-token-action@00eaec58ee1bfea9c8b48655b7ab7470b07739e5 # main 2026-11-17
        with:
          client-id: ${{ secrets.CODER_CLA_APP_ID }}
          kms-key: ${{ secrets.CODER_CLA_APP_KMS_KEY }}
          workload-identity-provider: ${{ secrets.APP_KEYS_WORKLOAD_ID_PROVIDER }}
          owner: coder
          repositories: cla
          permissions: |
            contents: write

      - name: "CLA Assistant"
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ steps.cla_token.outputs.token }}
        with:
          remote-organization-name: 'coder'
          remote-repository-name: 'cla'
          path-to-signatures: 'v2022-09-04/signatures.json'
          path-to-document: 'https://github.com/coder/cla/blob/main/README.md'
          # branch should not be protected
          branch: 'main'
          allowlist: dependabot*
